---
- name: Rulebook de monitoreo de alertas
  hosts: all
  sources:
    - name: webhook
      ansible.eda.webhook:
        host: 0.0.0.0
        port: 6666

  rules:
    - name: Newrelic | Alerta FS lleno /terraform
      condition: event.payload.sources == "newrelic"
      action:
        run_workflow_template:
          name: "WF_Limpieza_fs"
          organization: "Desarrollo"
          job_args:
            extra_vars:
              servidor: "{{ event.payload.hostname }}"
              fs: "{{ event.payload.filesystem }}"

    - name: "IIS Pool Down — Remediación automática (Dynatrace)"
      condition: >
        event.payload.eventData.source == 'Dynatrace'
        and event.payload.eventData.description is search("IIS Pool", ignorecase=true)
        and event.payload.eventData.status == "ACTIVE"
      action:
        run_workflow_template:
          name: "ID00_WF_Reinicio_Pool_IIS"
          organization: "Desarrollo"
          job_args:
            extra_vars:
              target_host: "{{ event.payload.eventData.server }}"
              app_pool_name: "{{ event.payload.eventData.pool }}"
              dynatrace_problem_id: "{{ event.payload.eventData.problem_id }}"
              ticket_id: "{{ event.payload.eventData.zammad_ticket_id }}"
              ticket_number: "{{ event.payload.eventData.zammad_ticket_number }}"

    - name: "Instana | Limpieza filesystem Linux"
      # El orquestador (Azure Function) ya filtra eventos con state=CLOSED
      # antes de reenviarlos aquí, así que no hace falta revalidar el estado.
      condition: >
        event.payload.source == "instana-orchestrator"
        and event.payload.event.category == "filesystem"
        and event.payload.event.filesystem != "n/a"
      action:
        run_workflow_template:
          name: "ID00_WF_Limpieza_FS"
          organization: "Desarrollo"
          job_args:
            extra_vars:
              servidor: "{{ event.payload.event.host }}"
              fs: "{{ event.payload.event.filesystem }}"
              uso_pct: "{{ event.payload.event.value }}"
              severity: "{{ event.payload.event.severity }}"
              instana_event_id: "{{ event.payload.event.event_id }}"
              ticket_number: "{{ event.payload.ticket.number }}"

    - name: "Instana | IIS carga elevada — Remediación automática"
      # OJO: esta alerta es de VOLUMEN de requests (umbral superado), no de
      # pool caído. Restart automático bajo alta carga puede ser
      # contraproducente (corta conexiones activas justo cuando el sitio
      # está más ocupado). Confirmar que este es el comportamiento deseado
      # antes de dejarlo corriendo sin supervisión.
      condition: >
        event.payload.source == "instana-orchestrator"
        and event.payload.event.category == "iis_app_pool"
        and event.payload.event.site_name != "n/a"
      action:
        run_job_template:
          name: "ID00_Reinicio_Pool_IIS"
          organization: "Desarrollo"
          job_args:
            extra_vars:
              app_pool_name: "{{ event.payload.event.site_name }}"
              dynatrace_problem_id: "{{ event.payload.event.event_id }}"
              ticket_id: "{{ event.payload.ticket.id }}"
              ticket_number: "{{ event.payload.ticket.number }}"

    - name: Autogestión de cuenta
      condition: >
        event.payload.source == "identity-selfservice"
      action:
        run_workflow_template:
          name: "ID00_WF_GestionUsuarios"
          organization: "Desarrollo"
          job_args:
            extra_vars:
              username: "{{ event.payload.event.username }}"
              action: "{{ event.payload.event.action }}"
              requested_by: "{{ event.payload.event.requested_by }}"
              ticket_id: "{{ event.payload.ticket.id }}"
              ticket_number: "{{ event.payload.ticket.number }}"

    - name: Autorremediación para cuenta de servicio
      condition: >
        event.payload.eventData.source == 'Dynatrace' 
        and event.payload.eventData.description is search("Cuenta de servicio bloqueada", ignorecase=true) 
        and event.payload.eventData.status == "ACTIVE"        
      action:
        run_workflow_template:
          name: "ID00_WF_GestionUsuarios"
          organization: "Desarrollo"
          job_args:
            extra_vars:
              username: "{{ event.payload.eventData.username }}"
              action: "{{ event.payload.eventData.action }}"
              requested_by: "{{ event.payload.eventData.requested_by }}"
              ticket_id: "{{ event.payload.eventData.zammad_ticket_id }}"
              ticket_number: "{{ event.payload.eventData.zammad_ticket_number }}"
...
